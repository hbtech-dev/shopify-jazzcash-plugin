# JazzCash Thank You Page - Checkout UI Extension
# Uses @shopify/ui-extensions-react/checkout for proper React API access

api_version = "2025-07"

[[extensions]]
name = "jazzcash-thankyou-ui"
handle = "jazzcash-thankyou-ui"
type = "ui_extension"
uid = "99657634-ba52-2b1c-9d5f-c7cfbb68355ff7c0d52e"

[[extensions.targeting]]
